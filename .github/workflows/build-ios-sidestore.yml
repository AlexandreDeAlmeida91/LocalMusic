name: Build iOS IPA for SideStore

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Show Xcode version
        run: |
          xcodebuild -version
          swift --version

      - name: Install JavaScript dependencies
        run: npm install

      - name: Align Expo SDK 57 dependencies
        run: npx expo install --fix

      - name: Check Expo project
        run: npx expo-doctor

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -euo pipefail

          # Expo derives the Xcode workspace/scheme from the visible app name.
          # Resolve the generated workspace rather than hardcoding LocalMusic.
          APP_WORKSPACE="$(find ios -maxdepth 1 -type d -name '*.xcworkspace' -print -quit)"
          if [ -z "$APP_WORKSPACE" ]; then
            echo "No iOS .xcworkspace was generated"
            exit 1
          fi
          APP_SCHEME="$(basename "$APP_WORKSPACE" .xcworkspace)"
          echo "Workspace: $APP_WORKSPACE | Scheme: $APP_SCHEME"

          xcodebuild \
            -workspace "$APP_WORKSPACE" \
            -scheme "$APP_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(find "$PWD/build/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "No .app was produced."
            exit 1
          fi

          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/

          /usr/bin/zip -qry PeakMusic-unsigned.ipa Payload

          echo "Created:"
          ls -lh PeakMusic-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PeakMusic-iOS-IPA
          path: PeakMusic-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
